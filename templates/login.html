{% extends "base.html" %}
{% block content %}
<section class="auth-card">
    <a class="auth-back" href="{{ url_for('site.index') }}"
       aria-label="Quay về trang chủ" title="Quay về trang chủ">←</a>
    <div class="auth-heading">
        <p class="auth-eyebrow">PHÚC THỊNH ICT</p>
        <h2>Đăng nhập</h2>
        <p>Đăng nhập để tiếp tục sử dụng tài khoản của bạn.</p>
    </div>
    <form class="auth-form" method="post" action="{{ url_for('site.login') }}">
        <label for="identity">Tên tài khoản, email hoặc số điện thoại</label>
        <input id="identity" name="identity" type="text" value="{{ identity }}"
               autocomplete="username" maxlength="100" required>

        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>

        <button class="auth-submit" type="submit">Đăng nhập</button>
    </form>
    <p class="auth-switch"><a href="{{ url_for('site.forgot_password') }}">Quên mật khẩu?</a></p>
    <p class="auth-switch">Chưa có tài khoản? <a href="{{ url_for('site.register') }}">Đăng ký ngay</a></p>
</section>
{% endblock %}
