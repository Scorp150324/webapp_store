{% extends "base.html" %}
{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}
{% block content %}
<section class="auth-card">
    <a class="auth-back" href="{{ url_for('index') }}"
       aria-label="Quay về trang chủ" title="Quay về trang chủ">←</a>
    <div class="auth-heading">
        <p class="auth-eyebrow">PHÚC THỊNH ICT</p>
        <h2>Đăng nhập</h2>
        <p>Đăng nhập để tiếp tục sử dụng tài khoản của bạn.</p>
    </div>
    <form class="auth-form" method="post" action="{{ url_for('login') }}">
        <label for="username">Tên đăng nhập hoặc email</label>
        <input id="username" name="username" type="text" value="{{ username }}"
               autocomplete="username" maxlength="100" required>

        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>

        <button class="auth-submit" type="submit">Đăng nhập</button>
    </form>
    <p class="auth-switch">Chưa có tài khoản? <a href="{{ url_for('register') }}">Đăng ký ngay</a></p>
</section>
{% endblock %}
