{% extends "base.html" %}
{% block content %}
<section class="auth-card">
    <a class="auth-back" href="{{ url_for('site.index') }}"
       aria-label="Quay về trang chủ" title="Quay về trang chủ">←</a>
    <div class="auth-heading">
        <p class="auth-eyebrow">PHÚC THỊNH ICT</p>
        <h2>Đăng ký</h2>
        <p>Điền thông tin bên dưới để đăng ký tài khoản mới.</p>
    </div>
    <form class="auth-form" method="post" action="{{ url_for('site.register') }}">
        <label for="full_name">Họ và tên</label>
        <input id="full_name" name="full_name" type="text"
               autocomplete="name" maxlength="100" required>

        <label for="username">Tên tài khoản</label>
        <input id="username" name="username" type="text" autocomplete="username"
               maxlength="50" required>

        <label for="email">Email <span>(không bắt buộc)</span></label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="100">

        <label for="phone">Số điện thoại</label>
        <input id="phone" name="phone" type="tel"
               autocomplete="tel" maxlength="20" required>

        <label for="password">Mật khẩu</label>
        <div class="password-input-wrap">
            <input id="password" name="password" type="password"
                   autocomplete="new-password" minlength="8" maxlength="72" required>
            <button class="password-visibility-toggle" type="button"
                    aria-label="Hiện mật khẩu" aria-pressed="false"
                    aria-controls="password" title="Hiện mật khẩu">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
            </button>
        </div>
        <small>Mật khẩu tối thiểu 8 ký tự.</small>

        <label for="confirm_password">Nhập lại mật khẩu</label>
        <div class="password-input-wrap">
            <input id="confirm_password" name="confirm_password" type="password"
                   autocomplete="new-password" minlength="8" maxlength="72" required>
            <button class="password-visibility-toggle" type="button"
                    aria-label="Hiện mật khẩu" aria-pressed="false"
                    aria-controls="confirm_password" title="Hiện mật khẩu">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
            </button>
        </div>

        <button class="auth-submit" type="submit">Đăng ký</button>
    </form>
    <p class="auth-switch">Đã có tài khoản? <a href="{{ url_for('site.login') }}">Đăng nhập</a></p>
</section>
<script>
    document.querySelectorAll(".password-visibility-toggle").forEach((toggle) => {
        const password = document.getElementById(toggle.getAttribute("aria-controls"));
        if (!password) return;

        toggle.addEventListener("click", () => {
            const shouldShow = password.type === "password";
            password.type = shouldShow ? "text" : "password";
            toggle.setAttribute("aria-pressed", String(shouldShow));
            toggle.setAttribute("aria-label", shouldShow ? "Ẩn mật khẩu" : "Hiện mật khẩu");
            toggle.title = shouldShow ? "Ẩn mật khẩu" : "Hiện mật khẩu";
        });
    });
</script>
{% endblock %}
